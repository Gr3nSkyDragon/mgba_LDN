plugins {
    id 'com.android.application'
}

android {
    namespace 'io.mgbaldn.esp32test'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'io.mgbaldn.esp32test'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
